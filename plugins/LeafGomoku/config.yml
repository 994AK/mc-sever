arena:
  # Legacy/default main room template. On first v2 startup this is migrated into rooms.yml as room "main".
  # New rooms should be created in-game with /gomoku admin create <room>.
  world: "world"

  board:
    # Row 0, column 0. Each cell is one block.
    origin:
      x: 700
      y: 100
      z: -680
    row-axis: "+z"
    column-axis: "+x"

  emitters:
    black:
      x: 697
      y: 101
      z: -673
    white:
      x: 717
      y: 101
      z: -673

  seats:
    black:
      x: 707.5
      y: 101.0
      z: -682.5
      yaw: 0.0
      pitch: 0.0
    white:
      x: 707.5
      y: 101.0
      z: -684.5
      yaw: 0.0
      pitch: 0.0

  spectators:
    spawn:
      x: 707.5
      y: 102.0
      z: -687.5
      yaw: 0.0
      pitch: 0.0
    exit:
      x: 707.5
      y: 102.0
      z: -689.5
      yaw: 0.0
      pitch: 0.0
    capacity: 24

  lifecycle:
    open-by-default: true
    disconnect-recovery-ticks: 600
    forfeit-on-disconnect-timeout: true

  materials:
    empty-board: "STRIPPED_BIRCH_LOG"
    black: "BLACK_CONCRETE"
    white: "WHITE_CONCRETE"
    floor: "SMOOTH_STONE"
    frame: "GLASS"

  animation:
    ticks: 22
    arc-height: 1.4

  celebration:
    fireworks: 3

  gameplay:
    auto-reset-ticks: 120
    undo-request-timeout-ticks: 300

invites:
  timeout-ticks: 600

points:
  win: 3
  draw: 1
  loss: 0

environment-feedback:
  profiles:
    soft:
      actionbar: true
      particles: true
      sounds: true
      win-line: true
      countdown: true
    quiet:
      actionbar: true
      particles: false
      sounds: true
      win-line: false
      countdown: true

environment-templates:
  garden:
    display-name: "竹林棋亭"
    floor:
      default: "MOSS_BLOCK"
      accents:
        - row-min: -7
          row-max: 18
          column-min: 7
          column-max: 7
          material: "POLISHED_ANDESITE"
    frame:
      material: "OAK_FENCE"
      height: 2
      entrance-width: 5
    decor:
      - type: "column"
        row: -6
        column: -3
        y-offset: 1
        height: 3
        material: "BAMBOO_BLOCK"
      - type: "column"
        row: -6
        column: 17
        y-offset: 1
        height: 3
        material: "BAMBOO_BLOCK"
      - type: "block"
        row: -6
        column: 5
        y-offset: 1
        material: "LANTERN"
      - type: "block"
        row: -6
        column: 9
        y-offset: 1
        material: "LANTERN"
    feedback-profile: "soft"
    block-budget: 1500

appearances:
  board-themes:
    classic_logs:
      display-name: "经典原木棋盘"
      primary-material: "STRIPPED_BIRCH_LOG"
