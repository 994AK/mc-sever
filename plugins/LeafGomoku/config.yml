arena:
  # Legacy/default main room template. On first v2 startup this is migrated into rooms.yml as room "main".
  # New rooms should be created in-game with /gomoku admin create <room>.
  world: "world"

  board:
    # Row 0, column 0. Each cell is one block.
    origin:
      x: 700
      y: 100
      z: -680
    row-axis: "+z"
    column-axis: "+x"

  emitters:
    black:
      x: 697
      y: 101
      z: -673
    white:
      x: 717
      y: 101
      z: -673

  seats:
    black:
      x: 707.5
      y: 101.0
      z: -682.5
      yaw: 0.0
      pitch: 0.0
    white:
      x: 707.5
      y: 101.0
      z: -684.5
      yaw: 0.0
      pitch: 0.0

  spectators:
    spawn:
      x: 707.5
      y: 102.0
      z: -687.5
      yaw: 0.0
      pitch: 0.0
    exit:
      x: 707.5
      y: 102.0
      z: -689.5
      yaw: 0.0
      pitch: 0.0
    capacity: 24

  lifecycle:
    open-by-default: true
    disconnect-recovery-ticks: 600
    forfeit-on-disconnect-timeout: true

  materials:
    empty-board: "STRIPPED_BIRCH_LOG"
    black: "BLACK_CONCRETE"
    white: "WHITE_CONCRETE"
    floor: "SMOOTH_STONE"
    frame: "GLASS"

  animation:
    ticks: 22
    arc-height: 1.4

  celebration:
    fireworks: 3

  gameplay:
    auto-reset-ticks: 120

points:
  win: 3
  draw: 1
  loss: 0

appearances:
  board-themes:
    classic_logs:
      display-name: "经典原木棋盘"
      primary-material: "STRIPPED_BIRCH_LOG"
      secondary-material: "STRIPPED_SPRUCE_LOG"
      default: true
      cost: 0
    polished_stone:
      display-name: "磨制石棋盘"
      primary-material: "SMOOTH_STONE"
      secondary-material: "POLISHED_ANDESITE"
      default: false
      cost: 30
  piece-skins:
    black_concrete:
      display-name: "黑色混凝土"
      display: "block"
      material: "BLACK_CONCRETE"
      animation: "arc"
      default: true
      cost: 0
    white_concrete:
      display-name: "白色混凝土"
      display: "block"
      material: "WHITE_CONCRETE"
      animation: "arc"
      default: true
      cost: 0
    red_concrete:
      display-name: "红色混凝土"
      display: "block"
      material: "RED_CONCRETE"
      animation: "arc"
      default: true
      cost: 0
    blue_concrete:
      display-name: "蓝色混凝土"
      display: "block"
      material: "BLUE_CONCRETE"
      animation: "arc"
      default: true
      cost: 0
    skeleton_head:
      display-name: "骷髅头"
      display: "head"
      material: "SKELETON_SKULL"
      animation: "pop"
      default: true
      cost: 0
    steve_head:
      display-name: "Steve 头颅"
      display: "head"
      material: "PLAYER_HEAD"
      head-owner: "Steve"
      animation: "pop"
      default: false
      cost: 15
    tnt_block:
      display-name: "TNT 爆破棋子"
      display: "block"
      material: "TNT"
      animation: "explosion"
      default: false
      cost: 18
    amethyst:
      display-name: "紫水晶块"
      display: "block"
      material: "AMETHYST_BLOCK"
      animation: "arc"
      default: false
      cost: 20
    emerald:
      display-name: "绿宝石块"
      display: "block"
      material: "EMERALD_BLOCK"
      animation: "arc"
      default: false
      cost: 25
    slime_entity:
      display-name: "静态史莱姆"
      display: "entity"
      material: "SLIME_BLOCK"
      entity-type: "SLIME"
      animation: "walk"
      default: false
      cost: 30
    bee_entity:
      display-name: "静态蜜蜂"
      display: "entity"
      material: "HONEYCOMB_BLOCK"
      entity-type: "BEE"
      animation: "walk"
      default: false
      cost: 30
