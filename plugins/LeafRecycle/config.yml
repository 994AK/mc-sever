    rejected: " §c回收站装不下，§e{rejected}§c 个物品还乖乖留在原地。"
    empty: "{prefix}§d小扫帚转了一圈~ §f主世界、地狱、末地都很干净，没有地上垃圾。"
    busy: "{prefix}§d小扫帚已经在路上啦~ §f等这轮清理结束再来一次。"

gui:
