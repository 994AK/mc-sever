header-footer:
  enabled: true
  designs:
    default:
      display-condition: '%world%!=disabledworld'
      header: []
      footer: []
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:admin,builder,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: false
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  enabled: false
  value: '%ping%'
  fancy-value: '&7延迟: &d%ping%'
  title: YuHua服务器
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: false
  value: '%health%'
  fancy-value: '&c%health%'
  fancy-value-default: NPC
  title: '&cHealth'
  disable-condition: '%world%=disabledworld'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: GREEN
      progress: '100'
      text: '&fYuHua服务器'
scoreboard:
  enabled: false
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards: {}
layout:
  enabled: true
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '&7... 还有 &f%s &7名玩家'
  empty-slot-ping-value: 1000
  layouts:
    default:
      slot-count: 40
      fixed-slots:
      - 1|&8&m------------&r &a在线玩家 &8&m------------
      - 21|&8&m------------&r &a在线玩家 &8&m------------
      groups:
        players:
          slots:
          - 2-20
          - 22-40
ping-spoof:
  enabled: false
  value: 0
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers: []
  server-groups: {}
placeholders:
  date-format: yyyy-MM-dd
  time-format: HH:mm:ss
  time-offset: 0
  register-tab-expansion: false
  locale: en-US
placeholder-output-replacements: {}
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%tps%': 1000
  '%mspt%': 1000
  '%memory-used%': 1000
  '%memory-max%': 5000
  '%luckperms-prefix%': 1000
  '%luckperms-suffix%': 1000
assign-groups-by-permissions: false
primary-group-finding-list:
- admin
- builder
- default
permission-refresh-interval: 1000
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true
proxy-support:
  enabled: false
  channel-name-suffix: TAB
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
components:
  minimessage-support: true
  disable-shadow-for-heads: true
use-online-uuid-in-tablist: true
compensate-for-packetevents-bug: false
config-version: 6
per-world-playerlist:
  enabled: false
