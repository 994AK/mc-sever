# YuHua服务器 modular player menu.
# /commandgui opens this hub; /menu is provided by CMI CustomAlias.
language-file: "zh_cn.yml"
verbose-mode: false
gui-size-mode: "dynamic"
gui-tool: "CLOCK"

gui-items:
  - slot: 0
    name: "&b生存传送"
    command: "menuteleport"
    item: "ENDER_PEARL"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7出生点、死亡返回、公共地标"
      - "&8模块色：&b蓝色 = 移动"
      - "&f点击打开传送子菜单"

  - slot: 1
    name: "&6家园与地标"
    command: "menuhome"
    item: "RED_BED"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7家列表、设置家、删除家"
      - "&8模块色：&6金色 = 稳定据点"
      - "&f点击打开家园子菜单"

  - slot: 2
    name: "&2领地保护"
    command: "menuland"
    item: "GRASS_BLOCK"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7圈地流程、木锄、权限、删除"
      - "&8模块色：&2绿色 = 生存保护"
      - "&f点击打开领地子菜单"

  - slot: 3
    name: "&e项目日活"
    command: "menuprojects"
    item: "LECTERN"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7本周项目、每日任务、公会提案"
      - "&8模块色：&e黄色 = 公共建设"
      - "&f点击打开项目子菜单"

  - slot: 4
    name: "&d奖励与外观"
    command: "menuprofile"
    item: "EXPERIENCE_BOTTLE"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7在线奖励、皮肤菜单、玩家状态"
      - "&8模块色：&d紫色 = 个人配置"
      - "&f点击打开奖励子菜单"

  - slot: 5
    name: "&b玩家社交"
    command: "menusocial"
    item: "PLAYER_HEAD"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7传送请求、私聊、公会小队"
      - "&8模块色：&b青色 = 协作沟通"
      - "&f点击打开社交子菜单"

  - slot: 6
    name: "&f规则与帮助"
    command: "menuhelp"
    item: "BOOK"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7规则、菜单指南、联系管理"
      - "&8模块色：&f白色 = 说明"
      - "&f点击打开帮助子菜单"

  - slot: 7
    name: "&a菜单指南"
    command: "menunav"
    item: "COMPASS"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7查看菜单结构、配色和导航"
      - "&7每个子菜单底部都有上一页 / 下一页 / 主菜单"

  - slot: 8
    name: "&b取回菜单钟"
    command: "commandgui tool"
    item: "CLOCK"
    run-as-player: true
    cooldown: 10
    lore:
      - "&7丢了菜单钟时点这里重新领取"
      - "&7也可以输入 &f/menutool"

  - slot: 10
    name: "&a出生点"
    command: "spawn"
    item: "BEACON"
    run-as-player: true
    cooldown: 3
    lore:
      - "&7快速回到服务器出生点"
      - "&8常用直达"

  - slot: 11
    name: "&b返回上一个位置"
    command: "back"
    item: "ENDER_EYE"
    run-as-player: true
    cooldown: 5
    lore:
      - "&7死亡或传送后返回"
      - "&8常用直达"

  - slot: 12
    name: "&e我的家"
    command: "homes"
    item: "OAK_DOOR"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7查看并传送到已设置的家"
      - "&8常用直达"

  - slot: 13
    name: "&d在线奖励"
    command: "prewards"
    item: "AMETHYST_SHARD"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7领取可手动领取的在线奖励"
      - "&8常用直达"

  - slot: 14
    name: "&a皮肤菜单"
    command: "skins"
    item: "LEATHER_CHESTPLATE"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7打开 SkinsRestorer 皮肤菜单"
      - "&8常用直达"

  - slot: 15
    name: "&f服务器规则"
    command: "rules"
    item: "PAPER"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7查看服务器规则和常用入口"
      - "&8常用直达"

  - slot: 16
    name: "&c联系管理"
    command: "cmi msg %player% &c联系管理：&7输入 &f/helpop 内容 &7反馈卡顿、丢物、熊服、领地纠纷或其他问题。"
    item: "BELL"
    run-as-player: false
    cooldown: 2
    lore:
      - "&7需要输入具体内容"
      - "&f/helpop 内容"

  - slot: 17
    name: "&b随机传送"
    command: "rt"
    item: "CHORUS_FRUIT"
    run-as-player: true
    cooldown: 10
    lore:
      - "&7随机传送到主世界野外"
      - "&8范围由 CMI 随机传送配置控制"
      - "&8常用直达"

  - slot: 18
    name: "&7上一页：帮助"
    command: "menuhelp"
    item: "ARROW"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7主菜单的上一页入口"
      - "&8每个子菜单也有上一页"

  - slot: 22
    name: "&a回到主菜单"
    command: "menu"
    item: "CLOCK"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7重新打开模块主菜单"
      - "&8也可以输入 &f/menu"

  - slot: 26
    name: "&7下一页：传送"
    command: "menuteleport"
    item: "SPECTRAL_ARROW"
    run-as-player: true
    cooldown: 2
    lore:
      - "&7从第一个模块开始浏览"
      - "&8每个子菜单也有下一页"
