      - "&8Residence &7| &f/res create 名字"
      - "&8点击只提示命令"
    left_click_commands:
      - "[message] &7请在聊天中输入：&f/res create 名字"
    right_click_commands:
      - "[message] &7请在聊天中输入：&f/res create 名字"
  land_trust:
