    left_click_commands:
      - "[message] &7请在聊天中输入：&f/res pset 领地名 玩家名 build true"
    right_click_commands:
      - "[message] &7请在聊天中输入：&f/res pset 领地名 玩家名 build true"
  land_remove:
    material: "BARRIER"
    slot: 25
    display_name: "&c删除领地"
    lore:
      - "&7删除不再使用的领地"
      - "&c删除后通常需要二次确认"
      - "&8Residence &7| &f/res remove 名字"
      - "&8点击只提示命令"
    left_click_commands:
      - "[message] &7请在聊天中输入：&c/res remove 名字"
      - "[message] &7确认删除再输入：&c/res confirm"
    right_click_commands:
      - "[message] &7请在聊天中输入：&c/res remove 名字"
      - "[message] &7确认删除再输入：&c/res confirm"
