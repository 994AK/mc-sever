menu_title: "&e游戏功能"
open_command: "menuprojects"
register_command: true
size: 54
items:
  recycle:
    material: "HOPPER"
    slot: 10
    display_name: "&a资源回收站"
    lore:
      - "&7打开公共回收池，领取别人投放的资源"
      - "&8LeafRecycle &7| &f/recycle"
    left_click_commands:
      - "[player] recycle"
    right_click_commands:
      - "[player] recycle"
  recycle_submit:
    material: "BARREL"
    slot: 11
    display_name: "&a投放到回收站"
    lore:
      - "&7把多余资源放进公共回收池"
      - "&8LeafRecycle &7| &f/recycle submit"
    left_click_commands:
      - "[player] recycle submit"
    right_click_commands:
      - "[player] recycle submit"
  chain:
    material: "OAK_LOG"
    slot: 12
    display_name: "&2连锁采集"
    lore:
      - "&7成熟作物右键收割并补种"
      - "&7种子/骨粉可范围播种或施肥"
      - "&7斧头砍树，镐子挖矿可连锁"
      - "&8LeafChainHarvest &7| &f按操作触发"
      - "&8蹲下时不触发；材料需已开放"
    left_click_commands:
      - "[message] &a[连锁] &f右键成熟农作物可收割补种；手持种子/骨粉可范围播种或施肥。"
      - "[message] &a[连锁] &f斧头连锁砍木头，镐子连锁挖矿物；蹲下时不触发。若无效果，说明该动作或材料暂未开放。"
    right_click_commands:
      - "[message] &a[连锁] &f右键成熟农作物可收割补种；手持种子/骨粉可范围播种或施肥。"
      - "[message] &a[连锁] &f斧头连锁砍木头，镐子连锁挖矿物；蹲下时不触发。若无效果，说明该动作或材料暂未开放。"
  gomoku:
    material: "TARGET"
    slot: 13
    display_name: "&f五子棋大厅"
    lore:
      - "&7多人五子棋房间大厅"
      - "&7房间数：&f%leafgomoku_room_count%"
      - "&8LeafGomoku &7| &f/menugomoku"
    left_click_commands:
      - "[player] menugomoku"
    right_click_commands:
      - "[player] menugomoku"
  projects:
    material: "LECTERN"
    slot: 14
    display_name: "&e本周项目"
    lore:
      - "&7查看官方项目、提案位和参与方式"
      - "&8CMI CustomText &7| &f/projects"
    left_click_commands:
      - "[player] projects"
    right_click_commands:
      - "[player] projects"
  daily:
    material: "WRITABLE_BOOK"
    slot: 15
    display_name: "&e每日 / 每周任务"
    lore:
      - "&7查看每日和每周轻任务入口"
      - "&8CMI Alias + Quests &7| &f/daily"
    left_click_commands:
      - "[player] daily"
    right_click_commands:
      - "[player] daily"
  quests_list:
    material: "EXPERIENCE_BOTTLE"
    slot: 16
    display_name: "&e任务列表"
    lore:
