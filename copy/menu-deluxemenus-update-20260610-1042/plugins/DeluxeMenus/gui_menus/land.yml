menu_title: "&2领地保护"
open_command: menuland
register_command: true
size: 45
items:
  hoe:
    material: WOODEN_HOE
    slot: 10
    display_name: "&a领取木锄"
    lore:
      - "&7由服务器发 1 把 Residence 选区木锄"
      - "&7左键第一个角，右键第二个角。"
    click_commands:
      - "[player] menuhoe"
      - "[close]"
  selected_y:
    material: DEEPSLATE
    slot: 11
    display_name: "&2高度按选区"
    lore:
      - "&7左键低处角，右键高处对角。"
      - "&7Y 轴圈多少就是多少。"
  create:
    material: GRASS_BLOCK
    slot: 12
    display_name: "&7/res create 名字"
    lore:
      - "&7创建领地"
      - "&8先把名字改成自己的领地名"
    click_commands:
      - "[message] &7请在聊天中输入：&f/res create 名字"
      - "[close]"
  quick_select:
    material: OAK_FENCE
    slot: 14
    display_name: "&2快速选 48x16x48"
    lore:
      - "&7站在建筑中心执行"
      - "&f/res select 48 16 48"
    click_commands:
      - "[player] res select 48 16 48"
      - "[close]"
  list:
    material: MAP
    slot: 15
    display_name: "&2我的领地"
    lore:
      - "&7执行 /res list"
    click_commands:
      - "[player] res list"
      - "[close]"
  limits:
    material: WRITABLE_BOOK
    slot: 16
    display_name: "&2查看限制"
    lore:
      - "&7执行 /res limits"
    click_commands:
      - "[player] res limits"
      - "[close]"
  build_perm:
    material: BRICKS
    slot: 20
    display_name: "&7给朋友建筑权限"
    lore:
      - "&f/res pset 领地名 玩家名 build true"
      - "&7先确认对方可信"
    click_commands:
      - "[message] &7请在聊天中输入：&f/res pset 领地名 玩家名 build true"
      - "[close]"
  container_perm:
    material: CHEST
    slot: 21
    display_name: "&7给朋友开箱权限"
    lore:
      - "&f/res pset 领地名 玩家名 container true"
      - "&c谨慎使用"
    click_commands:
      - "[message] &7请在聊天中输入：&f/res pset 领地名 玩家名 container true"
      - "[close]"
  remove:
    material: TNT
    slot: 23
    display_name: "&c删除领地"
    lore:
      - "&f/res remove 名字"
      - "&7随后通常需要 &f/res confirm"
    click_commands:
      - "[message] &7请在聊天中输入：&c/res remove 名字"
      - "[message] &7确认删除再输入：&c/res confirm"
      - "[close]"
  norm:
    material: OAK_SIGN
    slot: 24
    display_name: "&7圈地规范"
    lore:
      - "&7只圈自己的建筑、机器、仓库和施工边。"
      - "&7不要圈公共道路、村庄、地狱门、别人家。"
      - "&7不要圈大片未开发空地。"
  previous:
    material: ARROW
    slot: 36
    display_name: "&7上一页：家园与地标"
    click_commands:
      - "[openguimenu] home"
  main:
    material: CLOCK
    slot: 40
    display_name: "&a回到主菜单"
    click_commands:
      - "[openguimenu] main"
  next:
    material: SPECTRAL_ARROW
    slot: 44
    display_name: "&7下一页：奖励外观"
    click_commands:
      - "[openguimenu] profile"
