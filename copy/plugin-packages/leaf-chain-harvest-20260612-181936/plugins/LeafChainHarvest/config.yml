messages:
  prefix: "§a[连锁] §f"
  no-permission: "{prefix}§c你没有权限使用这个功能。"
  player-only: "{prefix}这个命令只能由玩家执行。"
  reloaded: "{prefix}已重载连锁采集配置。"
  menu-opened: "{prefix}已打开连锁采集管理菜单。"
  toggled: "{prefix}{target} 已切换为 {state}。"
  protected: "{prefix}§c这个位置受保护，已跳过。"
  sowed: "{prefix}已播种 §a{count} §f处。"
  fertilized: "{prefix}已施肥 §a{count} §f处。"
  help:
    - "{prefix}命令："
    - "§7/leafchain menu §f打开管理菜单"
    - "§7/leafchain reload §f重载配置"

gui:
  title: "§0连锁采集"
  materials-title: "§0连锁材料: {group}"

actions:
  collect:
    enabled: false
    permission: "leafchain.crop.collect"
  sow:
    enabled: false
    permission: "leafchain.crop.sow"
    radius: 3
    max-targets: 24
  fertilize:
    enabled: false
    permission: "leafchain.crop.fertilize"
    radius: 3
    max-targets: 24

crops:
  enabled: true
  disable-when-sneaking: true
  replant-delay-ticks: 1
  require-tool: false
  max-collect-blocks: 64
  tools:
    - WOODEN_HOE
    - STONE_HOE
    - IRON_HOE
    - GOLDEN_HOE
    - DIAMOND_HOE
    - NETHERITE_HOE
  standard:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - COCOA
  vertical:
    - SUGAR_CANE
    - BAMBOO
    - CACTUS
  full-block:
    - MELON
    - PUMPKIN

